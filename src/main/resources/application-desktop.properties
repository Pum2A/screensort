spring.docker.compose.enabled=false
server.address=127.0.0.1
server.port=0
spring.datasource.url=${SCREENSORT_DB_URL}
spring.datasource.username=screensort
spring.datasource.password=${SCREENSORT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
screensort.desktop.token=${SCREENSORT_DESKTOP_TOKEN}
screensort.desktop.state-file=${SCREENSORT_DESKTOP_STATE_FILE}
screensort.analysis.url=${SCREENSORT_ANALYSIS_URL:http://127.0.0.1:8001}
screensort.analysis.token=${SCREENSORT_ANALYSIS_TOKEN:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
# Relative to the working directory, which the desktop shell sets to the app's local data folder.
screensort.preview.cache-dir=preview-cache
