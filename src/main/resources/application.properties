spring.application.name=ScreenSort

# Docker Compose is a development service and is enabled only by profiles that need it.
spring.docker.compose.enabled=false

# Flyway owns schema evolution; Hibernate checks mappings instead of changing the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Privacy-first local screenshot catalog and organizer
info.app.version=@project.version@

# The demo profile reuses the local PostgreSQL infrastructure.
spring.profiles.group.demo=local
