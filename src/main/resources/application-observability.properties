# Explicit developer profile only. Desktop retains its authenticated health-only endpoint.
spring.config.activate.on-profile=observability & !desktop
management.server.port=19091
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Fixed metric dimensions; no file or job identifiers.
management.metrics.distribution.percentiles-histogram.screensort.operation=true
management.metrics.distribution.percentiles-histogram.screensort.analysis.inference=true
