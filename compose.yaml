name: screensort

services:
  postgres:
    # Same major version as the Testcontainers tests; `latest` can jump a major version.
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=screensort'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-screensort}'
      - 'POSTGRES_USER=screensort'
    ports:
      # Loopback only, random host port: a dev database must not be reachable from the LAN.
      - '127.0.0.1::5432'
