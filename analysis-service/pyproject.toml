[project]
name = "screensort-analysis"
version = "0.1.0"
description = "Local authenticated OCR and visual analysis with bounded model execution."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "onnxruntime>=1.26,<2",
    "pillow>=12.3.0",
    "pydantic>=2.11,<3.0",
    "rapidocr==3.10.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
vision = [
    "huggingface-hub==2.2.0",
    "torch==2.14.1",
    "transformers==5.19.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "vision", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screensort_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".cache"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
