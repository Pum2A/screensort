[project]
name = "screensort-analysis"
version = "0.1.0"
description = "Local OCR and visual analysis service for ScreenSort (health-only scaffold)."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screensort_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".cache"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
